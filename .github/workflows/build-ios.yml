name: Build iOS framework

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify packaging and rejection paths
        shell: pwsh
        run: ./tests/package-smoke.ps1

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download iOS SDK
        run: |
          wget -q https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mv sdks-master/iPhoneOS17.0.sdk ./iPhoneOS17.0.sdk

      - name: Build arm64 framework
        run: |
          mkdir -p build
          clang++ -target arm64-apple-ios15.0 \
            -isysroot ./iPhoneOS15.6.sdk \
            -std=c++17 -fobjc-arc -O2 \
            -dynamiclib -lobjc \
            -install_name @executable_path/Frameworks/GlowESP.framework/GlowESP \
            -framework Foundation -framework UIKit -framework QuartzCore -framework Metal \
            -fuse-ld=lld \
            src/Overlay.mm src/Runtime.mm -o build/GlowESP

      - name: Guard Unity 6000 GC handle ABI
        run: |
          clang++ -std=c++17 tests/handle-abi.cpp -o build/handle-abi-test
          build/handle-abi-test

      - name: Build read-only device diagnostic variant
        run: |
          mkdir -p build/dev
          clang++ -target arm64-apple-ios15.0 \
            -isysroot ./iPhoneOS15.6.sdk \
            -std=c++17 -fobjc-arc -O2 -DGLOW_DEV_BRIDGE=1 \
            -dynamiclib -lobjc \
            -install_name @executable_path/Frameworks/GlowESP.framework/GlowESP \
            -framework Foundation -framework UIKit -framework QuartzCore -framework Metal \
            -fuse-ld=lld \
            src/Overlay.mm src/Runtime.mm -o build/dev/GlowESP

      - name: Validate framework
        run: |
          # Валидация Info.plist (заменяет plutil)
          python3 -c "import plistlib; plistlib.load(open('Info.plist', 'rb'))"
          # Проверка архитектуры (заменяет lipo)
          file build/GlowESP | grep -q "Mach-O 64-bit dynamically linked shared library arm64"

      - name: Package artifact
        run: |
          mkdir -p build/GlowESP.framework build/dev/GlowESP.framework
          cp build/GlowESP build/GlowESP.framework/GlowESP
          cp Info.plist build/GlowESP.framework/Info.plist
          
          cp build/dev/GlowESP build/dev/GlowESP.framework/GlowESP
          cp Info.plist build/dev/GlowESP.framework/Info.plist

          cd build
          zip -r GlowESP.framework.zip GlowESP.framework
          zip -r GlowESP.dev.framework.zip dev/GlowESP.framework
          shasum -a 256 GlowESP.framework.zip > SHA256SUMS.txt
          printf '%s\n' 'Ad hoc signed framework. Re-sign with the containing app before installation.' > ARTIFACT-NOTES.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GlowESP-arm64-${{ github.sha }}
          path: |
            build/GlowESP.framework.zip
            build/GlowESP.dev.framework.zip
            build/SHA256SUMS.txt
            build/ARTIFACT-NOTES.txt
          if-no-files-found: error
          retention-days: 14
