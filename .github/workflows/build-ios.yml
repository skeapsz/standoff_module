name: Build iOS framework

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download iOS SDK
        run: |
          wget -q https://github.com/Tonwalter888/iOS-SDKs/archive/refs/heads/main.zip
          unzip -q main.zip
          mv iOS-SDKs-main/iPhoneOS17.5.sdk ./iPhoneOS17.5.sdk

      - name: Build GlowESP
        run: |
          mkdir -p build
          clang++ -target arm64-apple-ios15.0 \
            -isysroot ./iPhoneOS17.5.sdk \
            -std=c++17 -fobjc-arc -O2 \
            -dynamiclib -lobjc \
            -install_name @executable_path/Frameworks/GlowESP.framework/GlowESP \
            -framework Foundation -framework UIKit -framework QuartzCore -framework Metal -framework CoreGraphics \
            -fuse-ld=lld \
            src/Overlay.mm src/Runtime.mm -o build/GlowESP

      - name: Package framework
        run: |
          mkdir -p build/GlowESP.framework
          cp build/GlowESP build/GlowESP.framework/GlowESP
          cp Info.plist build/GlowESP.framework/Info.plist
          cd build
          zip -r GlowESP.framework.zip GlowESP.framework

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlowESP-framework
          path: build/GlowESP.framework.zip
